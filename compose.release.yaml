# deploy/update.sh resolves one complete release into this local digest lock.
services:
  migrate:
    build: !reset null
    extends:
      file: deploy/.release.json
      service: migrate
  web:
    build: !reset null
    extends:
      file: deploy/.release.json
      service: web
  ai-worker:
    build: !reset null
    extends:
      file: deploy/.release.json
      service: ai-worker
