# Published v2 images. APP_VERSION may pin a v2 release tag.
services:
  migrate:
    build: !reset null
    image: ghcr.io/tairuiqu/oh-my-paper-migrate:${APP_VERSION:-latest}
  web:
    build: !reset null
    image: ghcr.io/tairuiqu/oh-my-paper:${APP_VERSION:-latest}
  ai-worker:
    build: !reset null
    image: ghcr.io/tairuiqu/oh-my-paper-ai-worker:${APP_VERSION:-latest}
